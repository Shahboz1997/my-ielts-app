name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      AUTH_SECRET: ci-build-secret-minimum-32-characters-long
      NEXTAUTH_SECRET: ci-build-secret-minimum-32-characters-long
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: [lint, build]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_URL: http://127.0.0.1:3000
      E2E_MOCK_OPENAI: '1'
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      OPENAI_API_KEY: sk-e2e-ci-placeholder-not-used
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Require CI secrets for E2E
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$AUTH_SECRET" ] || [ -z "$E2E_TEST_EMAIL" ] || [ -z "$E2E_TEST_PASSWORD" ]; then
            echo "::error::Set GitHub secrets: DATABASE_URL, AUTH_SECRET, E2E_TEST_EMAIL, E2E_TEST_PASSWORD (optional DIRECT_URL)."
            exit 1
          fi
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Ensure E2E test user
        run: node ./scripts/ensure-e2e-user.mjs
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
