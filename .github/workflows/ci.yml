name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      AUTH_SECRET: ci-build-secret-minimum-32-characters-long
      NEXTAUTH_SECRET: ci-build-secret-minimum-32-characters-long
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: [lint, build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      AUTH_SECRET: ci-e2e-secret-minimum-32-characters-long
      NEXTAUTH_SECRET: ci-e2e-secret-minimum-32-characters-long
      NEXTAUTH_URL: http://127.0.0.1:3000
      E2E_MOCK_OPENAI: '1'
      E2E_INSECURE_AUTH_COOKIES: '1'
      E2E_TEST_EMAIL: e2e@ci.example.com
      E2E_TEST_PASSWORD: ci-e2e-password-12
      OPENAI_API_KEY: sk-e2e-ci-placeholder-not-used
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Ensure E2E test user
        run: node ./scripts/ensure-e2e-user.mjs
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
